name: Voyage 每日签到

# 每天 3 个触发时段兜底：GitHub 的定时任务在负载高时会延迟甚至跳过，
# 官方不保证准点。多跑是安全的——签到接口幂等，已签账号直接跳过不重复领，
# 所以当天第一次成功的触发完成签到，后面几次都是空跑（日志显示 already）。
on:
  schedule:
    # UTC = 北京时间 - 8
    - cron: "30 1 * * *"    # 北京 09:30 主时段
    - cron: "0 4 * * *"     # 北京 12:00 兜底一
    - cron: "0 12 * * *"    # 北京 20:00 兜底二
  workflow_dispatch: {}

jobs:
  signin:
    runs-on: ubuntu-latest
    # 预算：抖动 ≤6min + 首跑 + 重试等待 ≤8min + 重试跑，放宽到 25min
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Actions 每次运行都是干净环境，三个运行时文件都要靠 artifact 续命：
      #   .auth.json   各账号登录态    —— 丢了就会每天重新登录，
      #                 而该站每登录一次就在「登录设备」里多堆一条记录
      #   .site.json   站点级 action id —— 丢了每个账号都要重扫十几个 JS chunk
      #   state.*.json 各账号签到状态（按账号隔离，共用一份会让后跑的账号漏签）
      - name: 恢复登录态与状态
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voyage-state
          path: .

      # 随机抖动：实际签到时间 = 计划时刻 ±3 分钟。
      # 基准用 github.run_started_at（scheduled 触发时≈cron 时刻），
      # 这样 checkout/setup 耗掉的时间被算进去，请求落点仍在窗口内。
      # 手动 Run workflow 时跳过抖动，立即执行，方便调试。
      - name: 随机抖动（±3 分钟）
        if: github.event_name != 'workflow_dispatch'
        run: |
          START=$(date -u -d "${{ github.run_started_at }}" +%s)
          NOW=$(date -u +%s)
          OFFSET=$(( (RANDOM % 361) - 180 ))
          WAIT=$(( START + OFFSET - NOW ))
          echo "计划时刻 + ${OFFSET}s 偏移；当前需等待 ${WAIT}s（负数=已过窗口，立即执行）"
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi

      - name: 执行签到
        id: run
        continue-on-error: true
        env:
          # 账号按槽位拆分：VOYAGE_ACCOUNT_1 … VOYAGE_ACCOUNT_8,每个装一个账号
          #   值格式  账号::密码[::备注]
          # 没建的槽位展开成空字符串，解析器自动跳过，所以加账号只需新建
          # VOYAGE_ACCOUNT_3,不用改这个文件。
          # 开头的 VOYAGE_ACCOUNTS 是旧的合并值，作过渡兜底：这样 workflow 与
          #   secret 谁先建都不会让那次运行失败；两者重叠的账号会按账号去重。
          #   新槽位跑通后，可以直接删掉旧 secret。
          # 写成单行是刻意的：值里出现换行会破坏脚本的按行解析
          VOYAGE_ACCOUNTS: ${{ secrets.VOYAGE_ACCOUNTS }}|${{ secrets.VOYAGE_ACCOUNT_1 }}|${{ secrets.VOYAGE_ACCOUNT_2 }}|${{ secrets.VOYAGE_ACCOUNT_3 }}|${{ secrets.VOYAGE_ACCOUNT_4 }}|${{ secrets.VOYAGE_ACCOUNT_5 }}|${{ secrets.VOYAGE_ACCOUNT_6 }}|${{ secrets.VOYAGE_ACCOUNT_7 }}|${{ secrets.VOYAGE_ACCOUNT_8 }}
        run: node signin.mjs

      # 重试整批是安全的：已签过的账号会被服务端幂等判据直接跳过。
      # 间隔同样 ±3 分钟随机，避免每次都在固定秒数后出现第二次请求。
      - name: 失败重试
        if: steps.run.outcome == 'failure'
        id: retry
        continue-on-error: true
        env:
          VOYAGE_ACCOUNTS: ${{ secrets.VOYAGE_ACCOUNTS }}|${{ secrets.VOYAGE_ACCOUNT_1 }}|${{ secrets.VOYAGE_ACCOUNT_2 }}|${{ secrets.VOYAGE_ACCOUNT_3 }}|${{ secrets.VOYAGE_ACCOUNT_4 }}|${{ secrets.VOYAGE_ACCOUNT_5 }}|${{ secrets.VOYAGE_ACCOUNT_6 }}|${{ secrets.VOYAGE_ACCOUNT_7 }}|${{ secrets.VOYAGE_ACCOUNT_8 }}
        run: |
          OFFSET=$(( (RANDOM % 361) - 180 ))
          WAIT=$(( 300 + OFFSET ))
          echo "重试前等待 ${WAIT}s（300s ± 3min）"
          sleep "$WAIT"
          node signin.mjs

      - name: 保存登录态与状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voyage-state
          path: |
            .auth.json
            .site.json
            state.json
            state.*.json
          if-no-files-found: warn
          retention-days: 60

      - name: 标记失败
        if: steps.run.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "仍有账号失败，请看上方汇总表"
          exit 1
